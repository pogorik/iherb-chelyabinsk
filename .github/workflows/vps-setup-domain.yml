name: VPS Setup Domain Nginx

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Update nginx server_name for the domain
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo -n sed -i "s/server_name .*/server_name xn---74-5cdfx1a1d1b.xn--p1ai www.xn---74-5cdfx1a1d1b.xn--p1ai ${{ secrets.VPS_HOST }};/" /etc/nginx/sites-available/iherb && sudo -n nginx -t 2>&1 && sudo -n systemctl reload nginx && echo "OK: nginx reloaded" && echo "--- final config ---" && cat /etc/nginx/sites-available/iherb'

name: VPS Nginx Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Check nginx config and certbot
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'echo "--- nginx status ---"; systemctl is-active nginx 2>&1; echo "--- sites-enabled ---"; ls -la /etc/nginx/sites-enabled/ 2>&1; echo "--- config content ---"; for f in /etc/nginx/sites-enabled/*; do echo "=== $f ==="; cat "$f" 2>&1; done; echo "--- certbot installed? ---"; which certbot 2>&1; echo "--- existing certs ---"; sudo -n certbot certificates 2>&1'

name: VPS Final Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: PM2 status and external self-test
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'pm2 list; echo "=== self test ==="; curl -s -o /dev/null -w "http:80 -> %{http_code} redirect:%{redirect_url}\n" -H "Host: xn---74-5cdfx1a1d1b.xn--p1ai" http://127.0.0.1/catalog; curl -sk -o /dev/null -w "https:443 -> %{http_code}\n" -H "Host: xn---74-5cdfx1a1d1b.xn--p1ai" https://127.0.0.1/catalog'

name: VPS Deep Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: PM2 status and app crash logs
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'echo "=== pm2 list ==="; pm2 list; echo "=== pm2 describe (restart info) ==="; pm2 describe iherb-chelyabinsk 2>&1 | grep -iE "restart|uptime|status|memory|exec mode"; echo "=== last 80 error lines ==="; pm2 logs iherb-chelyabinsk --err --lines 80 --nostream 2>&1; echo "=== memory/free ==="; free -h; echo "=== dmesg oom ==="; sudo -n dmesg 2>&1 | grep -i "out of memory\|killed process" | tail -10'

name: VPS Status Check

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Report PM2 and app directory status
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd "${{ secrets.VPS_APP_DIR }}"; echo "--- env files ---"; ls -la .env* 2>&1; echo "--- env var NAMES only (no values) from .env.local ---"; cut -d= -f1 .env.local 2>&1; echo "--- pm2 describe env keys ---"; pm2 describe iherb-chelyabinsk 2>&1 | grep -i "env:" -A 30 | grep -oE "^\s*[A-Z_]+:" | head -30'

name: VPS Status Check

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Report PM2 and app directory status
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'PID=$(pm2 jlist 2>/dev/null | node -e "const d=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\")); const p=d.find(x=>x.name===\"iherb-chelyabinsk\"); console.log(p ? p.pid : \"\")"); echo "PID=$PID"; echo "--- actual running process env var NAMES only (values redacted) ---"; sudo -n cat /proc/$PID/environ 2>&1 | tr "\\0" "\\n" | cut -d= -f1; echo "--- without sudo ---"; cat /proc/$PID/environ 2>&1 | tr "\\0" "\\n" | cut -d= -f1'

      - name: Check for a local Postgres instance
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'echo "--- systemd postgres service ---"; systemctl list-units --type=service 2>&1 | grep -i postgres; echo "--- docker containers ---"; docker ps -a 2>&1 | grep -i postgres; echo "--- listening on 5432 ---"; ss -ltnp 2>&1 | grep 5432; echo "--- pg_lsclusters ---"; pg_lsclusters 2>&1; echo "--- postgres data dirs ---"; find /var/lib/postgresql /etc/postgresql -maxdepth 2 2>&1'

      - name: Clean test - flush logs, hit endpoint locally, check fresh output
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'pm2 flush iherb-chelyabinsk; sleep 1; curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000/api/products; sleep 1; echo "--- out log ---"; cat ~/.pm2/logs/iherb-chelyabinsk-out.log; echo "--- error log ---"; cat ~/.pm2/logs/iherb-chelyabinsk-error.log'

name: VPS Status Check

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Report PM2 and app directory status
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd "${{ secrets.VPS_APP_DIR }}"; echo "--- find any .env files anywhere under app dir ---"; find . -maxdepth 2 -iname ".env*" 2>&1; echo "--- pm2 env var NAMES only (values redacted) ---"; pm2 jlist 2>/dev/null | node -e "const d=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\")); const p=d.find(x=>x.name===\"iherb-chelyabinsk\"); console.log(p ? Object.keys(p.pm2_env.env||{}).join(\"\\n\") : \"not found\")"'

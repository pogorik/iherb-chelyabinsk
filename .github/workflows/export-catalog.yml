name: Export Catalog CSV

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all products from Supabase
        run: |
          curl -s "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/products?select=*&order=brand,name&limit=2000" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -o products.json
          echo "--- bytes ---"; wc -c products.json
          echo "--- count ---"; python3 -c "import json;print(len(json.load(open('products.json'))))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: products.json

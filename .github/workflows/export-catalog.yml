name: Export Catalog CSV

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Supabase reachability
        run: |
          echo "secret URL length: ${#SUPA_URL}"
          echo "secret KEY length: ${#SUPA_KEY}"
          echo "--- try secret host ---"
          curl -s -o /dev/null -w "http_code=%{http_code} exit ok\n" --max-time 20 \
            "$SUPA_URL/rest/v1/products?select=id&limit=1" -H "apikey: $SUPA_KEY" || echo "curl exit=$?"
          echo "--- try known host directly ---"
          curl -s -o r.json -w "http_code=%{http_code}\n" --max-time 20 \
            "https://hfiaquyffhnkmqybooyu.supabase.co/rest/v1/products?select=*&order=brand,name&limit=2000" \
            -H "apikey: $SUPA_KEY" || echo "curl exit=$?"
          echo "--- bytes/count if any ---"
          [ -f r.json ] && wc -c r.json && python3 -c "import json;d=json.load(open('r.json'));print('rows=',len(d) if isinstance(d,list) else d)" || echo "no file"
        env:
          SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: r.json
          if-no-files-found: ignore

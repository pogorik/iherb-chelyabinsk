name: Export Catalog CSV

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch catalog from the live site API
        run: |
          echo "--- try https ---"
          curl -s -o products.json -w "https http_code=%{http_code}\n" --max-time 30 \
            "https://xn---74-5cdfx1a1d1b.xn--p1ai/api/products" || echo "https curl exit=$?"
          if [ ! -s products.json ]; then
            echo "--- fallback http via IP with Host header ---"
            curl -s -o products.json -w "ip http_code=%{http_code}\n" --max-time 30 \
              -H "Host: xn---74-5cdfx1a1d1b.xn--p1ai" "http://186.246.8.251/api/products" || echo "ip curl exit=$?"
          fi
          echo "--- bytes ---"; wc -c products.json
          echo "--- count ---"; python3 -c "import json;d=json.load(open('products.json'));print('rows=',len(d) if isinstance(d,list) else d)" || head -c 300 products.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: products.json

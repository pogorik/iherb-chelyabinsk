name: VPS Setup SSL

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Install certbot and issue certificate
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo -n apt-get update -y > /dev/null && sudo -n apt-get install -y certbot python3-certbot-nginx > /dev/null && sudo -n certbot --nginx -d xn---74-5cdfx1a1d1b.xn--p1ai -d www.xn---74-5cdfx1a1d1b.xn--p1ai --non-interactive --agree-tos --register-unsafely-without-email --redirect'
